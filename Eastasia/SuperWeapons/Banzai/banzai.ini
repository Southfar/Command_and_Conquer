SW.AlwaysGranted		= yes
RechargeTime			= 0
;----- UI -----
Action				= 
ShowTimer			= no
SW.ShowCameo			= no
DisableableFromShell		= no
;----- Targeting -----
SW.AutoFire=yes
SW.ManualFire=no
SW.AITargeting=NoTarget
