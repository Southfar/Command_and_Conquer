SecondaryDamage				= 50.00
SecondaryDamageRadius			= 100.0    
ScatterRadiusVsInfantry			= 30.00				; When this weapon is used against infantry, it can randomly miss by as much as this distance.
DamageType				= EXPLOSION
Warhead					= Explosion_wd2			; (PrimaryDamageRadius = 50.00) = (CellSpread = 2). 
ExtraWarheads				= Explosion_wd4			; (SecondaryDamageRadius = 100.0) = (CellSpread = 4). 
ExtraWarheads.DamageOverride		= 50.00
;----- Projection -----
Projectile				= FROG
ProjectileObject			= FROG				; Was "SCUDMissile". 
Range					= 14
MinimumRange				= 8
AttackRange				= 350.0
MinimumAttackRange			= 200.0
;----- Gfx -----
ProjectileObject			= SCUDMissile
  ProjectileExhaust           = ScudMissileExhaust
  VeterancyProjectileExhaust  = HEROIC HeroicScudMissileExhaust
  ProjectileDetonationFX      = WeaponFX_SCUDMissileDetonationExplosive
  RadiusDamageAffects         = ALLIES ENEMIES NEUTRALS NOT_SIMILAR
