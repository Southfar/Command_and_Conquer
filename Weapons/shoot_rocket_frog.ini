;------------------------------------------------------------------------------
; FROG launcher
; RA's SCUD
; Formerly [FROGLauncher], [LauncherFROG], [ShootFROG]. 
[ShootMislMM544Frog]
$inherits				= ShootMislMM122Katy
;----- Payload -----
Damage					= 200					; From V3RocketDamage. RA's SCUD is 600. 
PrimaryDamage				= 200.0
Warhead					= HE					; SCUDWH
RadiusDamageAffects			= ALLIES ENEMIES NEUTRALS NOT_SIMILAR	; "NOT_SIMILAR" is from xxx. I think it doesn't do any harm to have it here. 
;----- Sequence -----
ROF					= 400					; From V3's SpawnRegenRate. This is about 27 seconds. 
DelayBetweenShots			= 1
ClipSize				= 1					; how many shots in a Clip (0 == infinite)
; Uses a clip of one to get the Reloading modelcondition
ClipReloadTime				= 26666
;----- Projection -----
Projectile				= FROG
ProjectileObject			= FROG				; SCUDMissile
; note, these only apply to units that aren't the explicit target 
; (ie, units that just happen to "get in the way"... projectiles
; always collide with the Designated Target, regardless of these flags
ProjectileCollidesWith			= STRUCTURES
Speed					= 10
Range					= 10				; 18
MinimumRange				= 5.0				; 
MinimumAttackRange			= 125				; From Scud (gen/zh)
Spawner					= yes
;----- Audio -----
Report					= V3Attack
FireSound				= ScudLauncherWeapon
;----- Display -----
Anim					= V3TAKOFF
FireFX					= FX_ScudLauncherIgnition
ProjectileExhaust			= ScudMissileExhaust
VeterancyProjectileExhaust		= HEROIC HeroicScudMissileExhaust
DeathType				= EXPLODED

End

