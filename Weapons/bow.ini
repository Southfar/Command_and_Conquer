;------------------------------------------------------------------------------
[Bow&Fire]
$inherits			= Bow
;----- Payload -----
ExtraWarheads			= Fire
;----- Projection -----
Projectile			= ArrowFlame

;------------------------------------------------------------------------------
; Formerly [Bow_BlastArrow]. 
[Bow&Blast]
$inherits			= Bow&Fire
;----- Payload -----
