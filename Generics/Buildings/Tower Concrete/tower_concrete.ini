;------------------------------------------------------------------------------
; The short and stout one. 
; Used by civvie groups (Forgotten/Scavengers) in urban settings. 
; This is a difficult one to place, because it should exist both as a purely benign civilian structure, 
; and when owned by one of those groups, it should be armed. 
; CA0014 (TS, Observation Tower), arctic maps only. 
; ArgCmdr's Observation Tower
; Formerly [Tower_Concrete_1], [TowerConc1]. 
; Re-subsumes [CA0022] (Observation Tower/RA2 Observation Tower A). 
; SHP: ArgCmdr
[TowrConc]
$inherits			= TowrBrik
;----- Text -----
Name				= Observation Tower
UIName				= name:tower_conc
UIDescription			= desc:tower_conc
Nominal				= yes
;----- Gfx -----
Image				= caotwr
; Cameo				= icon_towrobsv
;----- Body -----
Strength			= 300
;----- Armor -----
Armor				= steel; heavy (ts)
ImmuneToEMP			= yes
Capturable			= yes
;----- Availability -----
Owner				= Special;Neutral,OTL,Scavengers
TechLevel			= 2;1;-1
Prerequisite			= Outpost
Cost				= 500
;----- Scoring -----
Points= 5
;----- Damage & Destruction -----
Explosion=TWLT070,S_BANG48,S_BRNL58,S_CLSN58,S_TUMU60
;TibSun>MaxDebris=0

;LeaveRubble=yes
;Sight=6 ; UC base values
Sight=9 ; Let's see if that works.

IsTrench			= Tunnel
RadarInvisible=yes
Armor				= concrete			; steel, TS: heavy
Armor				= steel				; TS: heavy


Explosion=TWLT070,S_BANG48,S_BRNL58,S_CLSN58,S_TUMU60
DebrisAnim=Dbris3sm,Dbris4lg,Dbris4sm,Dbris6sm,Dbris7lg,Dbris7sm,Dbris8sm,Dbris10lg,Dbris10sm



;----- Damage & destruction -----
DamageParticleSystems		= SmallGreySSys, BigGreySmokeSys
DebrisAnims			= DBRIS4LG,DBRIS4SM,DBRIS6LG
DebrisTypes			= 

DamageParticleSystems=SparkSys,SmallGreySSys,BigGreySmokeSys
DamageSmokeOffset=96, 64, 112
DebrisAnim=Dbris1sm,Dbris1lg,Dbris4sm,Dbris5sm,Dbris4lg,Dbris7sm,Dbris8sm,Dbris5lg,Dbris4lg
MaxDebris=15
MinDebris=5

;Prerequisite.Lists=2
RadarInvisible=yes
Points=5
Armor=steel		; TibSun>heavy
;TibSun>MaxDebris=0
;
ClickRepairable=no
Prerequisite=CACOMD
End
